<div id="taskDetailMain">
    <h1>Detail de la tache numero {{index}}</h1>

    <div id="nomTache">
        <label for="nom">nom de la tache : </label>
        <input id="nom" [ngModel]="nameTask()" (ngModelChange)="nameTask.set($event)">
    </div>
    <div id="etatTache">
        <p>Clique pour changer l'etat de la tache : </p>
        <button id="btnEtat" (click)="permuterEtat()">{{task.completed == true ? 'Tache complété' : 'Tache en cours'}}</button>
    </div>
    <p>Priorité : {{task.priorite}}</p>
    <p>Date de création : {{task.createdAt | date:'dd/MM/yyyy à HH:mm' }}</p>

    <button (click)="modifierTask()">Modifier les valeurs</button>
    @if (updated) {
    <p class="green">Tache modifiée !!!</p>
    }

</div>
